name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1 # v7

      - name: Verify tag matches Cargo.toml version
        run: |
          v=$(yq -e '.workspace.package.version' Cargo.toml)
          test "v$v" = "${GITHUB_REF_NAME}" \
            || { echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version v$v"; exit 1; }

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.0 # v2
        with:
          toolchain: stable
          cache: false
          rustflags: ""       # don't force -D warnings on the publish build

      - name: Install cargo-release
        uses: taiki-e/install-action@v2.87.14 # v2
        with:
          tool: cargo-release

      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@v1.0.5 # v1
        id: auth

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # actions/checkout leaves a detached HEAD when triggered by a tag push;
        # cargo-release's default allow-branch is ["*", "!HEAD"], so allow HEAD
        # explicitly (we publish the exact tagged commit; no tag/push happens here).
        run: cargo release --unpublished --workspace --no-tag --no-push --execute --no-confirm --allow-branch '*,HEAD'

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
